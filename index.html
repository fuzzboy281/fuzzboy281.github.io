<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Energies – Suivi câblage</title>
<style>
:root{
  --navy:#1b2a78; --red:#e3202f; --bg:#ffffff; --soft:#f2f5fb; --tx:#14204f; --mut:#6b7794;
  --a:#1b2a78; --b:#e3202f; --c:#6c7bc4;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Arial,sans-serif}
#app{height:100%}

/* ---------- AFFICHAGE TV ---------- */
.tv{height:100%;display:flex;flex-direction:column;padding:1.5vw 3vw}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:.35vw solid var(--red);padding-bottom:1vw}
.top img{height:9vw;max-height:130px}
.brand{font-weight:800;font-size:clamp(20px,3vw,54px);letter-spacing:.05em}
.brand span{color:var(--red)}
.tag{color:var(--mut);letter-spacing:.3em;font-size:clamp(10px,1.2vw,22px);font-weight:600}
.right{text-align:right;color:var(--mut);font-size:clamp(14px,1.6vw,28px)}
.right b{display:block;color:var(--navy);font-size:clamp(18px,2.4vw,44px)}
.stage{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:flex;flex-direction:column;justify-content:center;gap:2vw;pointer-events:none}
.slide.on{opacity:1}
h2{margin:0;font-size:clamp(22px,3vw,56px);color:var(--navy);border-left:.6vw solid var(--red);padding-left:1vw}
.big{font-size:clamp(60px,13vw,240px);font-weight:800;line-height:1;color:var(--navy)}
.big small{font-size:.28em;color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:clamp(16px,2vw,38px)}
.bar{height:clamp(14px,2vw,34px);background:#e3e8f5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red));border-radius:99px;transition:width .8s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}
.card{background:var(--soft);border-radius:1.4vw;padding:2vw;display:flex;flex-direction:column;gap:1vw;border-top:.5vw solid var(--k)}
.card h3{margin:0;font-size:clamp(20px,2.6vw,48px);color:var(--k)}
.num{font-size:clamp(40px,7vw,130px);font-weight:800;line-height:1;color:var(--navy)}
.num small{font-size:.35em;color:var(--mut);font-weight:600}
.card .bar i{background:var(--k)}
.ta{--k:var(--navy)} .tb{--k:var(--red)} .tc{--k:var(--c)}
.chart{display:flex;gap:1.5vw;height:42vh}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.6vw;justify-content:flex-end}
.bars{display:flex;gap:.4vw;align-items:flex-end;height:calc(100% - 3vw);width:100%}
.bars i{flex:1;border-radius:.4vw .4vw 0 0;min-height:3px}
.legend{display:flex;gap:2vw;font-size:clamp(14px,1.8vw,32px);font-weight:600}
.msg{font-size:clamp(28px,5vw,96px);font-weight:700;line-height:1.2;white-space:pre-wrap;color:var(--navy)}
.dots{display:flex;justify-content:center;gap:10px;padding-top:.8vw}
.dots span{width:12px;height:12px;border-radius:50%;background:#cfd6ea}
.dots span.on{background:var(--red)}
.gbtn{position:fixed;right:10px;bottom:10px;opacity:.1;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.gbtn:hover{opacity:1}

/* ---------- GESTION ---------- */
.adm{max-width:1000px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.adm h1{margin:0;color:var(--navy);font-size:26px;border-left:6px solid var(--red);padding-left:12px}
.adm .card{padding:16px;gap:12px;border-radius:14px}
.adm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1;min-width:120px}
.adm input,.adm textarea{background:#fff;color:var(--tx);border:1px solid #c9d1ea;border-radius:8px;padding:10px;font-size:16px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.days label.t{color:var(--red);font-weight:700}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn.s{background:var(--navy)}
#st{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const KEY = 'smart_energies_suivi_cablage';
const DEFAUT = {
  title: "Câblage des panneaux d'isolement",
  total: 100,            // ← nombre total de coffrets (modifiable dans Gestion)
  before: 0,             // coffrets déjà câblés avant la semaine
  week: "Semaine en cours",
  note: "",
  teams: [
    {n:"Équipe A", wt:20, dt:4, d:[0,0,0,0,0,0]},
    {n:"Équipe B", wt:20, dt:4, d:[0,0,0,0,0,0]},
    {n:"Équipe C", wt:20, dt:4, d:[0,0,0,0,0,0]}
  ]
};
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAUT); }catch(e){ return structuredClone(DEFAUT); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const D=['Lun','Mar','Mer','Jeu','Ven','Sam'], K=['ta','tb','tc'], COL=['var(--navy)','var(--red)','var(--c)'];
const app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const bar=(a,b)=>`<div class="bar"><i style="width:${pct(a,b)}%"></i></div>`;
const today=Math.min(5,(new Date().getDay()+6)%7);
const wDone=()=>S.teams.reduce((s,t)=>s+sum(t.d),0);
const allDone=()=>(+S.before||0)+wDone();
let cur=0, timer=null, mode='tv';

function slides(){
  const L=[];
  L.push(`<h2>${esc(S.title)}</h2>
    <div class="big">${allDone()}<small> / ${S.total} coffrets</small></div>
    ${bar(allDone(),S.total)}
    <div class="mut">${pct(allDone(),S.total)} % câblés · ${Math.max(0,S.total-allDone())} restants · ${wDone()} cette semaine</div>`);

  L.push(`<h2>Aujourd'hui (${D[today]}) et objectif de la semaine</h2>
    <div class="grid">${S.teams.map((t,i)=>{
      const x=+t.d[today]||0, w=sum(t.d);
      return `<div class="card ${K[i]}"><h3>${esc(t.n)}</h3>
        <div class="num">${x}<small> / ${t.dt} aujourd'hui</small></div>${bar(x,t.dt)}
        <div class="mut">Semaine : ${w} / ${t.wt}</div>${bar(w,t.wt)}</div>`;}).join('')}</div>`);

  const mx=Math.max(1,...S.teams.flatMap(t=>t.d.map(Number)),...S.teams.map(t=>+t.dt));
  L.push(`<h2>Production par jour</h2>
    <div class="chart">${D.map((d,j)=>`<div class="col"><div class="bars">${S.teams.map((t,i)=>
      `<i style="height:${(+t.d[j]||0)/mx*100}%;background:${COL[i]}"></i>`).join('')}</div><span class="mut">${d}</span></div>`).join('')}</div>
    <div class="legend">${S.teams.map((t,i)=>`<span style="color:${COL[i]}">■ ${esc(t.n)}</span>`).join('')}</div>`);

  if((S.note||'').trim()) L.push(`<h2>Information</h2><div class="msg">${esc(S.note)}</div>`);
  return L;
}

function tv(){
  mode='tv';
  const L=slides(); if(cur>=L.length) cur=0;
  app.innerHTML=`<div class="tv">
    <div class="top">
      <img src="SE.jpg" alt="Smart Energies" onerror="this.outerHTML='<div><div class=brand><span>SMART</span> ENERGIES</div><div class=tag>CREATE, BUILD, BE SMART</div></div>'">
      <div class="right"><b>${esc(S.week)}</b><span id="clk"></span></div>
    </div>
    <div class="stage">${L.map((h,i)=>`<div class="slide ${i==cur?'on':''}">${h}</div>`).join('')}</div>
    <div class="dots">${L.map((_,i)=>`<span class="${i==cur?'on':''}"></span>`).join('')}</div>
  </div><button class="gbtn" id="g">Gestion</button>`;
  document.getElementById('g').onclick=admin;
  const c=document.getElementById('clk');
  if(c) c.textContent=new Date().toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  clearInterval(timer);
  timer=setInterval(()=>{cur=(cur+1)%L.length; tv();},12000);
}

function admin(){
  mode='admin'; clearInterval(timer);
  app.innerHTML=`<div class="adm"><h1>Gestion – suivi câblage</h1>
  <div class="card"><div class="row">
    <label>Titre<input data-k="title" value="${esc(S.title)}"></label>
    <label>Semaine<input data-k="week" value="${esc(S.week)}"></label></div>
  <div class="row">
    <label>Total de coffrets à câbler<input type="number" min="0" data-k="total" value="${S.total}"></label>
    <label>Déjà câblés avant cette semaine<input type="number" min="0" data-k="before" value="${S.before}"></label></div></div>
  ${S.teams.map((t,i)=>`<div class="card ${K[i]}"><div class="row">
    <label>Nom<input data-t="${i}" data-f="n" value="${esc(t.n)}"></label>
    <label>Objectif semaine<input type="number" min="0" data-t="${i}" data-f="wt" value="${t.wt}"></label>
    <label>Objectif par jour<input type="number" min="0" data-t="${i}" data-f="dt" value="${t.dt}"></label></div>
    <div class="days">${D.map((d,j)=>`<label class="${j==today?'t':''}">${d}${j==today?' ●':''}<input type="number" min="0" data-t="${i}" data-d="${j}" value="${t.d[j]}"></label>`).join('')}</div></div>`).join('')}
  <div class="card"><label>Message à afficher (optionnel)<textarea rows="3" data-k="note">${esc(S.note)}</textarea></label></div>
  <div class="row"><button class="btn s" id="nw">Nouvelle semaine</button><button class="btn" id="bk">Voir l'affichage</button></div>
  <div id="st">Les modifications sont enregistrées automatiquement.</div></div>`;
  app.querySelectorAll('input,textarea').forEach(e=>e.oninput=()=>{
    const v=e.type=='number'?Math.max(0,+e.value||0):e.value;
    if(e.dataset.k) S[e.dataset.k]=v;
    else if(e.dataset.d) S.teams[e.dataset.t].d[e.dataset.d]=v;
    else S.teams[e.dataset.t][e.dataset.f]=v;
    save();
  });
  document.getElementById('bk').onclick=()=>{cur=0;tv();};
  document.getElementById('nw').onclick=()=>{
    if(confirm("Ajouter le total de la semaine aux coffrets déjà câblés et remettre les jours à 0 ?")){
      S.before=allDone(); S.teams.forEach(t=>t.d=[0,0,0,0,0,0]); save(); admin();
    }};
}

/* Synchronisation en direct entre deux fenêtres du même navigateur */
window.addEventListener('storage',e=>{ if(e.key===KEY && mode==='tv'){ S=load(); tv(); }});
document.addEventListener('keydown',e=>{
  if(mode!=='tv') return;
  if(e.key==='ArrowRight'){cur++;tv();}
  if(e.key==='ArrowLeft'){cur=Math.max(0,cur-1);tv();}
});
tv();
</script>
</body>
</html>
